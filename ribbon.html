<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A ribbon to the place to click</title>
<style>
  :root { --paper: #fbf7ef; --ink: #1f1a22; --ink-2: #4b4350; --mute: #8d8591; --red: #d3243e; --line: rgba(31, 26, 34, .13); --sys: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; --serif: "Iowan Old Style", "Palatino Linotype", Georgia, serif; --mark-accent: #ff7a88; --thread-accent: #ff5a6a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; color: var(--ink); font: 14px/1.45 var(--sys); -webkit-font-smoothing: antialiased; user-select: none; }
  body { background: radial-gradient(110% 90% at 20% 0%, #fffaf1 0%, #f6eee0 55%, #eadfca 100%); }
  button { font: inherit; color: inherit; }
  .hidden { display: none !important; }

  /* an example window to point at */
  .win { position: fixed; left: 6vw; top: 14vh; width: min(62vw, 760px); border-radius: 14px; overflow: hidden; background: #fffdf8; border: 1px solid var(--line); box-shadow: 0 24px 60px rgba(31, 26, 34, .18), 0 2px 8px rgba(31, 26, 34, .08); }
  .bar { position: relative; display: flex; align-items: center; gap: 7px; height: 38px; padding: 0 14px; background: #f1e9db; color: var(--ink-2); font-size: 12.5px; border-bottom: 1px solid var(--line); }
  .bar i { width: 11px; height: 11px; border-radius: 50%; background: rgba(31, 26, 34, .16); }
  .bar span { position: absolute; left: 0; right: 0; text-align: center; pointer-events: none; font-family: var(--serif); font-size: 13px; }
  .tools { display: flex; gap: 8px; padding: 14px 18px 0; }
  .btn { padding: 8px 18px; border-radius: 9px; border: 1px solid rgba(31, 26, 34, .2); background: #fff; cursor: pointer; transition: background .15s, transform .1s; }
  .btn:hover { background: #f3ede2; }
  .btn:active { transform: scale(.96); }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: var(--paper); font-weight: 600; }
  .btn.primary:hover { background: #3a3340; }
  .doc { display: grid; gap: 12px; padding: 22px 22px 8px; }
  .doc div { height: 9px; border-radius: 5px; background: #ece4d4; }
  .doc .m { width: 78%; } .doc .s { width: 52%; } .doc .l { width: 94%; }
  .foot { display: flex; justify-content: flex-end; padding: 8px 18px 18px; }

  /* the ribbon, bottom right, and the layer the thread is drawn on */
  #thread { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 7; }
  #mark { position: fixed; right: 8px; bottom: 8px; z-index: 6; width: 96px; height: 96px; padding: 0; border: 0; border-radius: 50%; background: transparent; cursor: pointer; outline: none; }
  #mark canvas { position: absolute; left: 50%; top: 50%; width: 156px; height: 156px; transform: translate(-50%, -50%); pointer-events: none; }
  #mark:focus-visible { box-shadow: 0 0 0 2px rgba(211, 36, 62, .5); }

  /* a label beside the place to click, and a note when something is clicked */
  .tag, .toast { position: fixed; z-index: 8; padding: 7px 14px; border-radius: 999px; background: var(--ink); color: var(--paper); box-shadow: 0 12px 30px rgba(31, 26, 34, .3); font-size: 13px; white-space: nowrap; animation: rise .22s cubic-bezier(.2, .8, .2, 1) both; }
  .tag b { color: #ff8b97; font-weight: 600; margin-right: 4px; }
  .toast { left: 22px; bottom: 22px; }
  .help { position: fixed; left: 22px; top: 18px; max-width: 440px; color: var(--mute); font-size: 12.5px; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .tag, .toast { animation: none; } }
</style>
</head>
<body>
  <p class="help">The ribbon runs from its corner to the place to click. Click that place and the ribbon draws back in. Click anywhere else to send it there. Click the ribbon itself to draw it back in, or to start the walk.</p>

  <section class="win" aria-label="An example window">
    <header class="bar"><i></i><i></i><i></i><span>Quarterly report: draft</span></header>
    <div class="tools">
      <button type="button" class="btn" id="b-export">Export</button>
      <button type="button" class="btn" id="b-share">Share</button>
      <button type="button" class="btn" id="b-print">Print</button>
    </div>
    <div class="doc"><div class="l"></div><div class="m"></div><div class="s"></div><div class="l"></div><div class="m"></div><div class="s"></div><div class="m"></div></div>
    <footer class="foot"><button type="button" class="btn primary" id="b-save">Save</button></footer>
  </section>

  <canvas id="thread" aria-hidden="true"></canvas>
  <button type="button" id="mark" aria-label="Start over"><canvas id="mark-canvas" aria-hidden="true"></canvas></button>
  <div id="tag" class="tag hidden" role="status"><b>Click</b><span id="tag-text"></span></div>
  <div id="toast" class="toast hidden" role="status"></div>

  <script>// The ribbon: the material and the geometry shared by the mark (a trefoil
// knot tied in red satin) and the thread it lets out across the screen.
//
// A ribbon here is a centre line, a width direction at each point, and a
// light. Each short piece of the ribbon is lit from its own surface normal,
// with a soft body (half-Lambert), a satin streak (an anisotropic highlight
// that runs across the ribbon where it turns to the light) and a sheen at its
// edges. Both faces are red; a ribbon with a reverse can show it a shade deeper. Canvas 2D only, no
// libraries, nothing to load.
(() => {
  'use strict';

  const TAU = Math.PI * 2;
  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  const smooth = (v) => { const x = clamp(v, 0, 1); return (3 - 2 * x) * x * x; };
  const mix = (a, b, f) => a + (b - a) * f;

  // ---- colour --------------------------------------------------------------------
  const PALETTE = {
    front: [206, 14, 30],      // red satin
    back: [150, 9, 22],        // the underside, deeper
    shadow: [38, 2, 6],        // the darkest fold
    spec: [255, 196, 184],     // the streak of light on the weave, warm
    sheen: [255, 72, 56],      // the glow at a turning edge
  };
  const LIGHT = (() => { const l = [-0.42, -0.62, 0.66]; const n = Math.hypot(l[0], l[1], l[2]); return l.map((v) => v / n); })();
  const HALF = (() => { const h = [LIGHT[0], LIGHT[1], LIGHT[2] + 1]; const n = Math.hypot(h[0], h[1], h[2]); return h.map((v) => v / n); })();

  /**
   * The colour of one piece of ribbon.
   * @param {number} nx @param {number} ny @param {number} nz  surface normal, view space, any sign
   * @param {number} tx @param {number} ty @param {number} tz  direction the ribbon runs
   * @param {number} depth 0 far .. 1 near
   * @param {{lift?:number, glint?:number, tint?:number[], tintAmount?:number, oneSided?:boolean}} [o] lift: extra light; glint: travelling-light amount; oneSided: no deeper reverse
   * @returns {number[]} [r, g, b], 0..255
   */
  function shade(nx, ny, nz, tx, ty, tz, depth, o = {}) {
    const face = nz >= 0 ? 1 : -1;                 // which side of the ribbon is toward us
    const sx = nx * face; const sy = ny * face; const sz = nz * face;
    const ndl = sx * LIGHT[0] + sy * LIGHT[1] + sz * LIGHT[2];
    const wrap = 0.5 + 0.5 * ndl;
    const body = 0.2 + 0.8 * Math.pow(wrap, 1.35);
    // satin: bright where the ribbon runs across the half-vector (Kajiya-Kay)
    const th = tx * HALF[0] + ty * HALF[1] + tz * HALF[2];
    const along = Math.sqrt(Math.max(0, 1 - th * th));
    const nh = sx * HALF[0] + sy * HALF[1] + sz * HALF[2];
    const spec = Math.pow(along, 34) * (0.2 + 0.8 * clamp(nh * 0.5 + 0.5, 0, 1)) * (o.specK == null ? 1 : o.specK);
    // gloss: the face flashes where the ribbon rolls to mirror the light toward the eye
    const gloss = Math.pow(clamp((nh - 0.8) / 0.15, 0, 1), 2) * (o.glossK == null ? 1 : o.glossK);
    const sheen = Math.pow(1 - Math.min(1, Math.abs(nz)), 2.2);
    const base = o.oneSided || face > 0 ? PALETTE.front : PALETTE.back;
    const far = 0.72 + 0.28 * clamp(depth, 0, 1);
    const k = body * far * (1 + (o.lift || 0));
    const sp = spec * 0.8 * far + gloss * 0.46 * far + (o.glint || 0) * 0.55;
    const sh = sheen * 0.4 * far;
    let r = mix(PALETTE.shadow[0], base[0], clamp(k, 0, 1.15)) + PALETTE.spec[0] * sp + PALETTE.sheen[0] * sh;
    let g = mix(PALETTE.shadow[1], base[1], clamp(k, 0, 1.15)) + PALETTE.spec[1] * sp + PALETTE.sheen[1] * sh;
    let b = mix(PALETTE.shadow[2], base[2], clamp(k, 0, 1.15)) + PALETTE.spec[2] * sp + PALETTE.sheen[2] * sh;
    if (o.tint && o.tintAmount) { r = mix(r, o.tint[0], o.tintAmount); g = mix(g, o.tint[1], o.tintAmount); b = mix(b, o.tint[2], o.tintAmount); }
    return [clamp(r, 0, 255), clamp(g, 0, 255), clamp(b, 0, 255)];
  }

  const rgb = (c, a) => (a == null || a >= 1 ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`);

  /** Read "#rrggbb" or "rgb(...)" from a CSS value. */
  function parseColor(raw, fallback) {
    const v = String(raw || '').trim();
    let m = v.match(/^#([0-9a-f]{6})$/i);
    if (m) { const n = parseInt(m[1], 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    m = v.match(/rgba?\(([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)/);
    return m ? [Number(m[1]), Number(m[2]), Number(m[3])] : fallback;
  }

  // ---- a soft light on top of everything (the travelling light, the tip) -------------
  function glow(ctx, x, y, radius, color, strength) {
    if (strength <= 0 || radius <= 0) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(x, y, 0, x, y, radius);
    g.addColorStop(0, `rgba(255,236,238,${(0.62 * strength).toFixed(3)})`);
    g.addColorStop(0.3, `rgba(${mix(255, color[0], 0.6) | 0},${mix(120, color[1], 0.6) | 0},${mix(130, color[2], 0.6) | 0},${(0.34 * strength).toFixed(3)})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, radius, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // ---- 3D helpers (plain arrays, short and clear) ----------------------------------------
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

  /**
   * Frames along a curve that do not flip: rotation-minimizing (double reflection).
   * @param {number[][]} P points  @param {number[][]} T unit tangents
   * @returns {number[][]} a unit "normal" at every point, perpendicular to its tangent
   */
  function transport(P, T) {
    const n = P.length;
    const t0 = T[0];
    const axis = Math.abs(t0[0]) < 0.6 ? [1, 0, 0] : [0, 1, 0];
    const R = [norm(cross(t0, axis))];
    for (let i = 0; i < n - 1; i += 1) {
      const v1 = [P[i + 1][0] - P[i][0], P[i + 1][1] - P[i][1], P[i + 1][2] - P[i][2]];
      const c1 = dot(v1, v1);
      let r = R[i];
      if (c1 > 1e-14) {
        const rl = [0, 1, 2].map((k) => r[k] - (2 / c1) * dot(v1, r) * v1[k]);
        const tl = [0, 1, 2].map((k) => T[i][k] - (2 / c1) * dot(v1, T[i]) * v1[k]);
        const v2 = [0, 1, 2].map((k) => T[i + 1][k] - tl[k]);
        const c2 = dot(v2, v2);
        r = c2 > 1e-14 ? [0, 1, 2].map((k) => rl[k] - (2 / c2) * dot(v2, rl) * v2[k]) : rl;
      }
      R.push(norm(r));
    }
    return R;
  }

  /** Unit tangents of a sampled curve (central differences). A closed curve repeats its first point last, so its ends look across the seam. */
  function tangents(P, closed) {
    const n = P.length;
    return P.map((_, i) => {
      const a = closed && (i === 0 || i === n - 1) ? P[n - 2] : P[Math.max(0, i - 1)];
      const b = closed && (i === 0 || i === n - 1) ? P[1] : P[Math.min(n - 1, i + 1)];
      return norm([b[0] - a[0], b[1] - a[1], b[2] - a[2]]);
    });
  }

  window.SatinMaterial = { TAU, clamp, smooth, mix, shade, rgb, parseColor, glow, dot, cross, norm, transport, tangents, PALETTE };
})();
</script>

  /** Unit tangents of a polyline, by central differences. */
  function directions(xs, ys) {

  function mount(canvas, mark, opts = {}) {

        const clear = smooth((path.main - run[i]) / 90);

      for (let i = 0; i < n; i += 1) {

        const tip = path.total > path.main ? smooth((run[i] - path.main) / (path.total - path.main)) : 0;      // 0 along the curve, 1 at the end of the curl

        phi[i] = mix(phi0, free, ease) * mix(1, 0.35, tip);

    }

      ctx.restore();

        const nx = s.ty[i] * sn; const ny = -s.tx[i] * sn; const nz = c;
        const sheen = 0.1 * s.shine[i];
        ctx.globalAlpha = s.run[i] < 0 ? clamp((s.run[i] + REACH_BACK) / REACH_BACK, 0, 1) * 0.9 : 1;
        for (const side of [-1, 1]) {
          const face = RB.norm([nx + side * CROWN * wx, ny + side * CROWN * wy, nz + side * CROWN * wz]);
          const col = RB.shade(face[0], face[1], face[2], s.tx[i], s.ty[i], 0, 0.9 + 0.08 * Math.sin(s.phi[i]), { glint: sheen, lift: sheen * 0.4, specK: 0.55, glossK: 0.6, oneSided: true });

          ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = fill; ctx.lineWidth = 0.7; ctx.stroke();
          ctx.beginPath(); ctx.moveTo(ox[i], oy[i]); ctx.lineTo(ox[j], oy[j]);
          ctx.strokeStyle = RB.rgb([col[0] * 0.5, col[1] * 0.5, col[2] * 0.5]); ctx.lineWidth = 0.85; ctx.stroke();

    function frame(now) {
      const dt = Math.min(0.05, (now - prev) / 1000); prev = now; clock += dt;
      fit(); readInk(now);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      let done = false;
      if (tween) {

        reach = tween.from + (tween.to - tween.from) * tween.curve(k);
        done = k >= 1;
      }
      if (mark.setUnravel) mark.setUnravel(clamp(reach * 1.6, 0, 1));
      if (done && phase === 'out') { phase = 'held'; heldAt = now; tween = null; onArrive(); }
      else if (done && phase === 'back') { clearAll(); halt(); onRewound(); return; }

      const path = plan ? currentPath(now) : null;
      if (!path || reach <= 0.001 || !tail) { next(); return; }
      const visible = reach * path.total;
      const s = samples(path, visible, mark.getTailFrame() || tail);
      if (!s) { next(); return; }
      paintRibbon(s);
      // the tip the answer sits beside is where the curve ends, not the end of the curl
      const at = Math.min(s.n - 1, Math.max(0, s.run.findIndex((l) => l >= Math.min(visible, path.main))));
      tipAt = { x: s.px[at >= 0 ? at : s.n - 1], y: s.py[at >= 0 ? at : s.n - 1] };
      if (phase === 'out') { ctx.save(); ctx.scale(ratio, ratio); RB.glow(ctx, s.px[s.n - 1], s.py[s.n - 1], 15, ink, 0.6); ctx.restore(); }

        if (calm) { reach = 1; tween = null; frame(now); phase = 'held'; heldAt = now; halt(); onArrive(); return true; }

      rewind() {

        phase = 'back';
        if (calm) { if (mark.setUnravel) mark.setUnravel(0); ctx.clearRect(0, 0, canvas.width, canvas.height); clearAll(); halt(); onRewound(); return; }

        begin();

      setTask(task) { canvas.dataset.task = String(task || ''); inkAt = 0; },
      setReducedMotion(v) { calm = !!v; if (calm && phase !== 'rest') { halt(); } },
      getTip: () => (tipAt ? { x: tipAt.x, y: tipAt.y } : null),
      getTarget: () => (box ? { ...box } : null),
      getState: () => ({ rest: 'idle', out: 'unwinding', held: 'pointing', back: 'rewinding' }[phase]),
      getProgress: () => reach,
      relayout() { if (box) replan(); },
      pause() { halt(); },
      resume() { if (phase !== 'rest' && !calm) begin(); },
      destroy() { halt(); window.removeEventListener('resize', onResize); },
    };
  }

  window.Strand = { mount };
})();

  <script>(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  const dock = $('#mark'); const tag = $('#tag'); const toast = $('#toast');
  const mark = Mark3D.mount($('#mark-canvas'), { scale: 0.2, focusGate: false });
  const thread = Strand.mount($('#thread'), mark, { onArrive: arrived, onRewound: rewound });

  // the places to click, in order
  const STEPS = [
    { el: $('#b-export'), label: 'Export', said: 'Exported.' },
    { el: $('#b-share'), label: 'Share', said: 'Shared.' },
    { el: $('#b-save'), label: 'Save', said: 'Saved.' },
  ];
  const PAUSE_MS = 600;      // between the ribbon being back in and the next one going out
  let at = -1;               // the step the ribbon is out to; -1 when it is out to a spot, or in
  let reaching = null;       // what it is out to: { box, text }
  let after = null;          // what to do once it is back in
  let toastTimer = 0;

  /** Turn the mark so its open end points at the middle of the page, from whichever corner it sits in. */
  function aimMark() {
    mark.setRotate(0);
    const open = mark.getTailAnchor(1);
    if (!open) return;
    const r = dock.getBoundingClientRect();
    const want = Math.atan2(innerHeight / 2 - (r.top + r.height / 2), innerWidth / 2 - (r.left + r.width / 2));
    mark.setRotate(want - Math.atan2(open.ty, open.tx));
  }

  const boxOf = (el) => { const r = el.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height }; };
  const inside = (box, x, y, slack) => x >= box.x - slack && x <= box.x + box.w + slack && y >= box.y - slack && y <= box.y + box.h + slack;

  function say(text) {
    clearTimeout(toastTimer);
    toast.textContent = text; toast.classList.remove('hidden');
    toastTimer = setTimeout(() => toast.classList.add('hidden'), 2600);
  }

  /** Put the label beside the box, on the side that fits and is farthest from where the ribbon comes in. */
  function placeTag() {
    if (!reaching) return;
    const { box, text } = reaching;
    $('#tag-text').textContent = text;
    tag.classList.remove('hidden');
    const w = tag.offsetWidth; const h = tag.offsetHeight; const gap = 14;
    const tip = thread.getTip() || { x: innerWidth, y: innerHeight };
    const cx = box.x + box.w / 2; const cy = box.y + box.h / 2;
    const d = Math.hypot(tip.x - cx, tip.y - cy) || 1;
    const spots = [
      { x: box.x, y: box.y + box.h + gap, dir: [0, 1] }, { x: box.x, y: box.y - h - gap, dir: [0, -1] },
      { x: box.x + box.w + gap, y: cy - h / 2, dir: [1, 0] }, { x: box.x - w - gap, y: cy - h / 2, dir: [-1, 0] },
    ].map((s) => ({ ...s, fits: s.x >= 8 && s.y >= 8 && s.x + w <= innerWidth - 8 && s.y + h <= innerHeight - 8, away: -(s.dir[0] * (tip.x - cx) + s.dir[1] * (tip.y - cy)) / d }));
    const pick = spots.filter((s) => s.fits).sort((a, b) => b.away - a.away)[0] || spots[0];
    tag.style.left = `${clamp(pick.x, 8, innerWidth - w - 8)}px`; tag.style.top = `${clamp(pick.y, 8, innerHeight - h - 8)}px`;
  }

  function reachFor(box, text, step) {
    at = step; reaching = { box, text };
    tag.classList.add('hidden');
    mark.setState('reading');
    thread.setTarget(box);
  }

  const goTo = (i) => reachFor(boxOf(STEPS[i].el), STEPS[i].label, i);

  /** The ribbon goes to wherever the person clicked: a small box around the spot. */
  function spot(x, y) {
    const s = 56;
    reachFor({ x: clamp(x - s / 2, 6, innerWidth - s - 6), y: clamp(y - s / 2, 6, innerHeight - s - 6), w: s, h: s }, 'here', -1);
  }

  /** Draw the ribbon back into the mark; `next`, if there is one, runs once it is in. */
  function retract(next) {
    after = next || null;
    tag.classList.add('hidden');
    if (thread.getState() === 'idle') rewound(); else thread.rewind();
  }

  function arrived() {
    mark.setState('ready'); placeTag();
  }
  function rewound() {
    reaching = null; at = -1; tag.classList.add('hidden'); mark.setState('idle');
    const next = after; after = null;
    if (next) setTimeout(next, PAUSE_MS);
  }

  document.addEventListener('click', (e) => {
    if (dock.contains(e.target)) { if (thread.getState() === 'idle') goTo(0); else retract(); return; }
    const i = STEPS.findIndex((s) => s.el === e.target);
    if (i >= 0) {
      say(STEPS[i].said);
      retract(i + 1 < STEPS.length ? () => goTo(i + 1) : () => say('That was the last place to click. Click the mark to see it again.'));
      return;
    }
    if (e.target.closest('.btn')) { say('That one is not part of this walk.'); return; }
    // the place the ribbon is pointing at, clicked: it has done its job
    if (reaching && at < 0 && thread.getState() === 'pointing' && inside(reaching.box, e.clientX, e.clientY, 10)) { retract(); return; }
    spot(e.clientX, e.clientY);
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') retract(); });
  addEventListener('resize', () => {
    aimMark();
    if (at >= 0) { reaching.box = boxOf(STEPS[at].el); thread.setTarget(reaching.box); } else thread.relayout();
  });

  aimMark();
  requestAnimationFrame(aimMark);
  mark.ready.then(value => { if (value) setTimeout(() => { if (thread.getState() === 'idle') goTo(0); }, 900); });
})();
</script>
