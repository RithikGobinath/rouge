<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;">
  <title>Thread preview</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: radial-gradient(120% 90% at 18% 0%, #33477f 0%, #19254a 45%, #0b1024 100%); font: 12px "Segoe UI", sans-serif; }
    #strand { position: fixed; inset: 0; width: 100%; height: 100%; --thread-accent: #ff606c; z-index: 7; pointer-events: none; }
    .doc { position: fixed; left: 6%; top: 18%; width: 52%; height: 52%; border-radius: 9px; background: #15182a; border: 1px solid rgba(255,255,255,.07); box-shadow: 0 18px 40px rgba(0,0,0,.45); }
    .doc .bar { height: 30px; background: #1c1f33; border-radius: 9px 9px 0 0; color: #9aa0b4; display: flex; align-items: center; padding: 0 12px; }
    .doc .err { margin: 90px 26px 0; padding: 10px 12px; border-radius: 7px; background: rgba(217,75,67,.12); border: 1px solid rgba(217,75,67,.35); color: #f0b3ae; font-size: 13px; width: 62%; }
    #box { position: fixed; right: 8px; bottom: 8px; width: 96px; height: 96px; --mark-accent: #90A5FF; }
    #box canvas { position: absolute; left: 50%; top: 50%; width: 156px; height: 156px; transform: translate(-50%, -50%); }
  </style>
</head>
<body>
  <div class="doc"><div class="bar">report-draft.docx</div><div class="err" id="err">Error: the linked file was not found</div></div>
  <canvas id="strand"></canvas>
  <div id="box"><canvas id="mark"></canvas></div>
  <script src="../shared/ribbon.js"></script>
  <script src="../shared/mark3d.js"></script>
  <script src="../shared/strand.js"></script>
  <script src="thread.js"></script>
</body>
</html>
