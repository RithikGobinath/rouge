<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;">
  <title>Logo</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
    #tile { position: absolute; inset: 0; }
    #tile.bg { border-radius: 22%; background: radial-gradient(90% 80% at 30% 15%, #fffaf1 0%, #f6eee0 60%, #eadfca 100%); box-shadow: inset 0 0 0 1px rgba(31,26,34,.1); }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="tile"><canvas id="mark"></canvas></div>
  <script src="../shared/ribbon.js"></script>
  <script src="../shared/mark3d.js"></script>
  <script src="logo.js"></script>
</body>
</html>
